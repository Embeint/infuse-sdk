description: TI BQ25798 Buck-Boost Battery Charger

compatible: "ti,bq25798"

include: [i2c-device.yaml]

bus: bq25798

properties:
  en-gpios:
    type: phandle-array
    required: true
    description: |
      Charger enable GPIO.

  int-gpios:
    type: phandle-array
    required: true
    description: |
      Charger interrupt GPIO.

  v-sys-min:
    type: int
    default: 3500
    description:
      Minimum system voltage in milliVolts. Supports 250mV steps
      from 2500 mV.
      Default is the POR value for a 1S battery.

  v-in-dpm:
    type: int
    enum: [
      3600, 3700, 3800, 3900, 4000, 4100, 4200, 4300, 4400, 4500,
      4600, 4700, 4800, 4900, 5000, 5100, 5200, 5300, 5400, 5500,
      5600, 5700, 5800, 5900, 6000, 6100, 6200, 6300, 6400, 6500,
      6600, 6700, 6800, 6900, 7000, 7100, 7200, 7300, 7400, 7500,
      7600, 7700, 7800, 7900, 8000, 8100, 8200, 8300, 8400, 8500,
      8600, 8700, 8800, 8900, 9000, 9100, 9200, 9300, 9400, 9500,
      9600, 9700, 9800, 9900, 10000, 10100, 10200, 10300, 10400, 10500,
      10600, 10700, 10800, 10900, 11000, 11100, 11200, 11300, 11400, 11500,
      11600, 11700, 11800, 11900, 12000, 12100, 12200, 12300, 12400, 12500,
      12600, 12700, 12800, 12900, 13000, 13100, 13200, 13300, 13400, 13500,
      13600, 13700, 13800, 13900, 14000, 14100, 14200, 14300, 14400, 14500,
      14600, 14700, 14800, 14900, 15000, 15100, 15200, 15300, 15400, 15500,
      15600, 15700, 15800, 15900, 16000, 16100, 16200, 16300, 16400, 16500,
      16600, 16700, 16800, 16900, 17000, 17100, 17200, 17300, 17400, 17500,
      17600, 17700, 17800, 17900, 18000, 18100, 18200, 18300, 18400, 18500,
      18600, 18700, 18800, 18900, 19000, 19100, 19200, 19300, 19400, 19500,
      19600, 19700, 19800, 19900, 20000, 20100, 20200, 20300, 20400, 20500,
      20600, 20700, 20800, 20900, 21000, 21100, 21200, 21300, 21400, 21500,
      21600, 21700, 21800, 21900, 22000
    ]
    default: 3600
    description:
      Minimum voltage target for the PMID supply in milliVolts.
      Supports 100mV steps from 3600mV to 22000mV.
      Default is the POR value.

  input-current-limit:
    type: int
    default: 3000
    description:
      Input current limit in milliAmps.
      Reducing this to 1A or less will give greater current resolution.
      Default is the POR value.

  constant-charge-current-max-microamp:
    type: int
    default: 1000000
    description:
      Maximum constant input current, resolution = 10 mA.
      Default is the POR value.

  charge-term-current-microamp:
    type: int
    default: 200000
    description:
      Current for charge termination phase, resolution = 40 mA.
      Default is the POR value.

  vac-ovp:
    type: int
    enum:
      - 26
      - 18
      - 12
      - 7
    default: 7
    description:
      Input voltage over-voltage protection limit. Default of 7V is the
      chip default.

  safety-timer:
    type: string
    enum:
      - "5h"
      - "8h"
      - "12h"
      - "24h"
      - "Disable"
    default: "12h"
    description:
      Fast charge safety timer duration. Charging is suspended if the safety
      timer expires before charge termination. Default is the POR value.

  mppt-ratio:
    type: int
    enum:
      - 56
      - 62
      - 68
      - 75
      - 81
      - 87
      - 93
      - 100
    description:
      Percentage of the open circuit voltage for the MPPT charger
      to aim for. Don't configure this property to disable MPPT.

  acdrv1-en:
    type: boolean
    description:
      Enable ACFET1-RBFET1 gate driver control

  acdrv2-en:
    type: boolean
    description:
      Enable ACFET2-RBFET2 gate driver control

  ts-rt1:
    type: int
    required: true
    description: |
      RT1 resistance in ohms.

  ts-rt2:
    type: int
    required: true
    description: |
      RT2 resistance in ohms.

  ntc-beta:
    type: int
    default: 3435
    description: |
      NTC Beta value. Default is for a 103AT-2 thermistor

  ntc-r0:
    type: int
    default: 10000
    description: |
      NTC R0 resistance in Ohms. Default is for a 103AT-2 thermistor

  ntc-t0:
    type: int
    default: 299
    description: |
      NTC T0 temperature in Kelvin. Default is for a 103AT-2 thermistor
