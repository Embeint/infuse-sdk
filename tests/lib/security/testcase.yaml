common:
  tags:
    - security
    - crypto
    - kv_store
    - secure_storage
    - tdf
  min_flash: 64
  min_ram: 32
  platform_allow:
    - mps2/an385
  integration_platforms:
    - mps2/an385
tests:
  lib.security: {}
  lib.security.alternate_cloud:
    extra_configs:
      - CONFIG_INFUSE_SECURITY_CLOUD_PUBLIC_KEY_FILE="alternate_cloud_public_key.yaml"
  lib.security.secondary_remote:
    extra_configs:
      - CONFIG_INFUSE_SECURITY_SECONDARY_REMOTE_ENABLE=y
