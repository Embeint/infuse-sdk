common:
  tags:
    - task_runner
    - data_logger
    - epacket
    - imu
    - kv_store
    - math
    - modem_monitor
    - rpc
    - states
    - tdf
    - time
    - version
    - watchdog
    - zbus
  min_flash: 64
  min_ram: 32
  required_snippets:
    - infuse
  integration_platforms:
    - mps2/an385
tests:
  task_runner.tasks.tdf_logger.complete: {}
  task_runner.tasks.tdf_logger.voltage:
    extra_configs:
      - CONFIG_TASK_TDF_LOGGER_BATTERY_TYPE_VOLTAGE=y
  task_runner.tasks.tdf_logger.soc:
    extra_configs:
      - CONFIG_TASK_TDF_LOGGER_BATTERY_TYPE_SOC=y
  task_runner.tasks.tdf_logger.battery_zero:
    extra_configs:
      - CONFIG_TASK_TDF_LOGGER_BATTERY_LOG_ZERO_ON_TIMEOUT=y
  task_runner.tasks.tdf_logger.storage:
    extra_dtc_overlay_files:
      - app.overlay
      - storage.overlay
