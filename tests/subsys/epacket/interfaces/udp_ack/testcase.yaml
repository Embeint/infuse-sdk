common:
  tags:
    - epacket
    - kv_store
    - net
    - reboot
    - rpc
    - security
    - states
    - tdf
    - time
    - watchdog
  min_flash: 64
  min_ram: 32
  run_sequential: true
tests:
  epacket.interface.udp.ack:
    tags: external_service
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      # Local cloud relay, DNS server and control channel provided by pytest/conftest.py
      - CONFIG_INFUSE_SECURITY_CLOUD_PUBLIC_KEY_FILE="cloud_local.yaml"
      - CONFIG_DNS_SERVER_IP_ADDRESSES=y
      - CONFIG_DNS_SERVER1="127.0.0.1:15355"
      - CONFIG_TEST_SHIM_CONTROL_PORT=15312
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
