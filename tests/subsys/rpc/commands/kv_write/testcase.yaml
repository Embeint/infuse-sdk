common:
  tags:
    - rpc
    - common_boot
    - epacket
    - kv_store
    - security
    - states
    - tdf
    - watchdog
  min_flash: 64
  min_ram: 32
  required_snippets:
    - infuse
  integration_platforms:
    - mps2/an385
tests:
  rpc.commands.kv_write: {}
  rpc.commands.kv_write.user_validation:
    extra_configs:
      - CONFIG_INFUSE_RPC_OPTION_KV_WRITE_APP_VALIDATE=y
  rpc.commands.kv_write.reflect_limit:
    extra_configs:
      - CONFIG_KV_STORE_REFLECT_MAX_SIZE=48
