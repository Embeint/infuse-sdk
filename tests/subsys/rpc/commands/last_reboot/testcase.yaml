common:
  tags:
    - rpc
    - common_boot
    - epacket
    - kv_store
    - reboot
    - security
    - states
    - tdf
    - time
    - watchdog
  min_flash: 64
  min_ram: 32
tests:
  rpc.commands.last_reboot:
    ignore_faults: true
    expect_reboot: true
    platform_exclude:
      - native_sim
      - nrf52_bsim
    required_snippets:
      - infuse
    integration_platforms:
      - mps2/an385
