common:
  tags:
    - bluetooth
    - auto
    - data_logger
    - epacket
    - kv_store
    - logging
    - math
    - rpc
    - states
    - task_runner
    - tdf
  build_only: true
  required_snippets:
    - infuse
  platform_allow:
    - nrf52_bsim/native
    - nrf54l15bsim/nrf54l15/cpuapp
    - nrf5340bsim/nrf5340/cpunet
  harness: bsim
tests:
  bluetooth.gatt:
    harness_config:
      bsim_exe_name: tests_bsim_bluetooth_gatt_prj_conf
  bluetooth.gatt.sdc:
    harness_config:
      bsim_exe_name: tests_bsim_bluetooth_gatt_sdc_prj_conf
    extra_args:
      - DTC_OVERLAY_FILE="./app.overlay;./nrf_sdc.overlay"
