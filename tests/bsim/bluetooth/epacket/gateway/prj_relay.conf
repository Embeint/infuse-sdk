# Bluetooth relay, matching the `gateway_bt` application:
#   2 backhaul clients + 2 forwarded connections + 2 connectable advertising sets
CONFIG_BT_MAX_CONN=6
CONFIG_EPACKET_FORWARDING_MAX_CONNECTIONS=2
CONFIG_EPACKET_BUFFERS_TX=8
CONFIG_EPACKET_BUFFERS_RX=16

# Originators in the simulation don't have the device key of the relay, allow the RPCs that
# connect the relay to devices to run with network authentication (1).
CONFIG_INFUSE_RPC_COMMAND_BT_CONNECT_INFUSE_REQUIRED_AUTH=1
CONFIG_INFUSE_RPC_COMMAND_BT_DISCONNECT_REQUIRED_AUTH=1
