common:
  tags:
    - net
    - epacket
    - kv_store
    - modem_monitor
    - rpc
    - states
    - tdf
    - time
  min_flash: 64
  min_ram: 32
tests:
  net.auto_sntp.triggered.native.sync:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
      - CONFIG_INFUSE_DNS_ASYNC=n
      - CONFIG_SNTP_AUTO_LOG_LEVEL_DBG=y
      # Local SNTP server provided by pytest/conftest.py
      - CONFIG_SNTP_AUTO_DEFAULT_SERVER="127.0.0.1"
      - CONFIG_TEST_SNTP_UNRESPONSIVE_SERVER="127.0.0.2"
      - CONFIG_SNTP_AUTO_SERVER_PORT=12303
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
  net.auto_sntp.triggered.native.async:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
      - CONFIG_INFUSE_DNS_ASYNC=y
      - CONFIG_SNTP_AUTO_LOG_LEVEL_DBG=y
      # Local SNTP server provided by pytest/conftest.py
      - CONFIG_SNTP_AUTO_DEFAULT_SERVER="127.0.0.1"
      - CONFIG_TEST_SNTP_UNRESPONSIVE_SERVER="127.0.0.2"
      - CONFIG_SNTP_AUTO_SERVER_PORT=12304
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
