common:
  tags:
    - net
    - epacket
    - kv_store
    - modem_monitor
    - rpc
    - states
    - tdf
    - time
  min_flash: 64
  min_ram: 32
tests:
  net.auto_sntp.immediate.wifi:
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    required_snippets:
      - infuse
    depends_on:
      - netif
      - wifi
  net.auto_sntp.immediate.native.sync:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    timeout: 120
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
      - CONFIG_SNTP_AUTO_QUERY_TIMEOUT_MS=2000
      - CONFIG_INFUSE_DNS_ASYNC=n
      # Local SNTP server provided by pytest/conftest.py
      - CONFIG_SNTP_AUTO_DEFAULT_SERVER="127.0.0.1"
      - CONFIG_TEST_SNTP_UNRESPONSIVE_SERVER="127.0.0.2"
      - CONFIG_SNTP_AUTO_SERVER_PORT=12301
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
  net.auto_sntp.immediate.native.async:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    timeout: 120
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
      - CONFIG_SNTP_AUTO_QUERY_TIMEOUT_MS=2000
      - CONFIG_INFUSE_DNS_ASYNC=y
      # Local SNTP server provided by pytest/conftest.py
      - CONFIG_SNTP_AUTO_DEFAULT_SERVER="127.0.0.1"
      - CONFIG_TEST_SNTP_UNRESPONSIVE_SERVER="127.0.0.2"
      - CONFIG_SNTP_AUTO_SERVER_PORT=12302
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
