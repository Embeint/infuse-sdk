common:
  tags:
    - net
    - epacket
    - kv_store
    - modem_monitor
    - rpc
    - states
    - tdf
  min_flash: 64
  min_ram: 32
tests:
  net.coap.general.wifi:
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    required_snippets:
      - infuse
    depends_on:
      - netif
      - wifi
  net.coap.general.native:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      # Local CoAP server provided by pytest/conftest.py
      - CONFIG_TEST_COAP_SERVER="127.0.0.1"
      - CONFIG_TEST_COAP_SERVER_PORT=15683
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
  net.coap.general.native.serial:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_INFUSE_COAP_BACKEND_SERIAL=y
      # Local CoAP server provided by pytest/conftest.py
      - CONFIG_TEST_COAP_SERVER="127.0.0.1"
      - CONFIG_TEST_COAP_SERVER_PORT=15686
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
