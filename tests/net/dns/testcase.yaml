common:
  tags:
    - net
    - epacket
    - kv_store
    - modem_monitor
    - rpc
    - states
    - tdf
  min_flash: 64
  min_ram: 32
tests:
  net.dns.wifi:
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    required_snippets:
      - infuse
    depends_on:
      - netif
      - wifi
  net.dns.native:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      # Local DNS server provided by pytest/conftest.py
      - CONFIG_DNS_SERVER1="127.0.0.1:15353"
    extra_args:
      - OVERLAY_CONFIG="overlay-nsos.conf"
    harness: pytest
