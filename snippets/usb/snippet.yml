name: usb

boards:
  # Nordic Development kits
  nrf7002dk/nrf5340/cpuapp:
    append:
      EXTRA_DTC_OVERLAY_FILE: nordic_usbd.overlay
  /nrf52.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: nordic_usbd.overlay
  /nrf53.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: nordic_usbd.overlay
  /nrf54lm20.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: nordic_usbd_hs.overlay
  /thingy5.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: nordic_usbd.overlay
  rpi_pico/rp2040:
    append:
      EXTRA_DTC_OVERLAY_FILE: rpi_pico.overlay
      EXTRA_CONF_FILE: rpi_pico.conf
  rpi_pico/rp2040/w:
    append:
      EXTRA_DTC_OVERLAY_FILE: rpi_pico.overlay
      EXTRA_CONF_FILE: rpi_pico.conf
  rpi_pico2/rp2350a/m33:
    append:
      EXTRA_DTC_OVERLAY_FILE: rpi_pico.overlay
      EXTRA_CONF_FILE: rpi_pico.conf
  rpi_pico2/rp2350a/m33/w:
    append:
      EXTRA_DTC_OVERLAY_FILE: rpi_pico.overlay
      EXTRA_CONF_FILE: rpi_pico.conf
