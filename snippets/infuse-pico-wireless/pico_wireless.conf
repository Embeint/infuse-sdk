# CYW43439 is shared by Wi-Fi, Bluetooth and the onboard LED.
CONFIG_BT=y
CONFIG_BT_HCI_VS=n
# CYW43439 implements legacy LE advertising/scanning commands.
CONFIG_BT_EXT_ADV=n
CONFIG_BT_MAX_CONN=1
CONFIG_NETWORKING=y
CONFIG_WIFI_AIROC=y
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y
CONFIG_NET_TCP=n
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_MAIN_STACK_SIZE=4096
# Wi-Fi association executes on the system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Connection events query WHD state from the net_mgmt event thread.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
# UDP receive callbacks decrypt ePackets on the socket service thread.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_LED=y
# Keep the native IP stack's packet pools modest on the RP2040.
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
