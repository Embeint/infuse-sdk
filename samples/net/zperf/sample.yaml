sample:
  description: Network performance measurement tool for Infuse-IoT
  name: infuse_zperf
common:
  build_only: true
  required_snippets:
    - infuse
  tags:
    - net
    - zperf
tests:
  sample.net.zperf:
    depends_on:
      - netif
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
  sample.net.zperf.halow:
    sysbuild: true
    platform_allow:
      - mm6108_ekh05/stm32u585xx
      - mm8108_ekh05/stm32u585xx
    integration_platforms:
      - mm8108_ekh05/stm32u585xx
