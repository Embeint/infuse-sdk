sample:
  description: Network performance measurement tool for Infuse-IoT
  name: infuse_zperf
common:
  build_only: true
  required_snippets:
    - infuse
  tags:
    - net
    - wifi
    - zperf
tests:
  sample.net.zperf:
    depends_on:
      - netif
    platform_exclude:
      - esp32c6_lcd_1_47/esp32c6/hpcore
      - esp32c6_lcd_1_47/esp32c6/hpcore/flash8m
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
  sample.net.zperf.esp32c6:
    sysbuild: true
    platform_allow:
      - esp32c6_lcd_1_47/esp32c6/hpcore
      - esp32c6_lcd_1_47/esp32c6/hpcore/flash8m
    integration_platforms:
      - esp32c6_lcd_1_47/esp32c6/hpcore
      - esp32c6_lcd_1_47/esp32c6/hpcore/flash8m
