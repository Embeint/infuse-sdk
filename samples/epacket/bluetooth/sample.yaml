sample:
  description: ePacket Bluetooth sample
  name: Bluetooth advertising and GATT
common:
  build_only: true
  required_snippets:
    - infuse
tests:
  sample.epacket.bluetooth:
    tags:
      - bluetooth
      - epacket
    platform_allow:
      - nrf52840dk/nrf52840
    integration_platforms:
      - nrf52840dk/nrf52840
  sample.epacket.bluetooth.sysbuild:
    tags:
      - bluetooth
      - epacket
    sysbuild: true
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf7002dk/nrf5340/cpuapp
      - thingy53/nrf5340/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
  sample.epacket.bluetooth.esp32c6:
    tags:
      - bluetooth
      - epacket
    sysbuild: true
    platform_allow:
      - esp32c6_lcd_1_47/esp32c6/hpcore
      - esp32c6_lcd_1_47/esp32c6/hpcore/flash8m
    integration_platforms:
      - esp32c6_lcd_1_47/esp32c6/hpcore
      - esp32c6_lcd_1_47/esp32c6/hpcore/flash8m
