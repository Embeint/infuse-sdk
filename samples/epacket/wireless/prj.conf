CONFIG_INFUSE_SDK=y
CONFIG_INFUSE_APPLICATION_ID=0x12345678
CONFIG_LED=y
CONFIG_BT=y
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_NET_CONTEXT_SNDTIMEO=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_INFUSE_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_INFUSE_CDC_ACM_SERIAL_PRODUCT_STRING="Infuse Wireless"

CONFIG_INFUSE_RPC_COMMAND_ECHO=y
CONFIG_INFUSE_RPC_COMMAND_KV_READ=y
CONFIG_INFUSE_RPC_COMMAND_REBOOT=y
CONFIG_INFUSE_RPC_COMMAND_LAST_REBOOT=y
CONFIG_INFUSE_RPC_COMMAND_WIFI_STATE=y
CONFIG_INFUSE_RPC_COMMAND_KV_WRITE=y

# Enumerate USB before common boot enables the radio, so failures are visible.
CONFIG_INFUSE_CDC_ACM_SERIAL_INITIALIZE_EARLY=y
