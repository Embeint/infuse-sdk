CONFIG_INFUSE_SDK=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_MAIN_STACK_SIZE=4096

# Display operation does not require a console, shell, or radio connection.
# Leave Infuse's system and runtime-device power management defaults enabled.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL=n
CONFIG_BT=n
