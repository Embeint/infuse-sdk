sample:
  description: Dynamic IMU Algorithms runner sample
  name: Dynamic IMU Algorithms runner
common:
  filter: dt_alias_exists("imu0")
  build_only: true
  required_snippets:
    - infuse
  integration_platforms:
    - thingy53/nrf5340/cpuapp
    - nrf54l15tag/nrf54l15/cpuapp
  tags: app
tests:
  sample.algorithms.imu_algo: {}
  sample.algorithms.imu_algo.native:
    extra_configs:
      - CONFIG_TEST_ALGORITHM_BUILD_NATIVE=y
  sample.algorithms.imu_algo.llext:
    extra_configs:
      - CONFIG_TEST_ALGORITHM_BUILD_LLEXT=y
