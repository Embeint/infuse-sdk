# Logger options
CONFIG_INFUSE_SDK=y
CONFIG_INFUSE_WATCHDOG=y

CONFIG_TASK_RUNNER=y
CONFIG_TASK_RUNNER_AUTO_ITERATE=y
CONFIG_TASK_RUNNER_TASK_IMU=y
CONFIG_TASK_RUNNER_TASK_BATTERY=y
CONFIG_TASK_RUNNER_TASK_TDF_LOGGER=y

CONFIG_ALGORITHM_RUNNER=y

CONFIG_INFUSE_RPC_COMMAND_ANNOTATE=y

# Disable KV schedule storage for sample to simplify testing
CONFIG_KV_STORE_KEY_TASK_SCHEDULES=n

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_ID=y

CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64

CONFIG_INFUSE_ALGORITHMS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_NRF_EDGEAI=y
CONFIG_LLEXT_VENEERS=y

CONFIG_LLEXT_EXPORT_SYMBOL_GROUP_LIBC=y
CONFIG_TEST_ALGORITHM_BUILD_NATIVE=n
CONFIG_TEST_ALGORITHM_BUILD_LLEXT=n
