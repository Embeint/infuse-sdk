sample:
  description: Hardware validation application
  name: Hardware validation
common:
  tags:
    - validation
    - charger
    - epacket
    - gnss
    - imu
    - kv_store
    - led
    - logging
    - mcumgr
    - modem
    - modem_monitor
    - net
    - rpc
    - security
    - sensor
    - shared_device
    - states
    - tdf
  build_only: true
  required_snippets:
    - infuse
tests:
  sample.validation:
    integration_platforms:
      - auroch/nrf9151/ns
      - kudu/nrf54l15/cpuapp
      - thingy53/nrf5340/cpuapp
      - tauro/nrf9151/ns
      - tauro2/nrf9151/ns
      - nrf54l15tag/nrf54l15/cpuapp
  sample.validation.nrf70_test:
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    extra_configs:
      - CONFIG_NETWORKING=n
      - CONFIG_VALIDATION_NRF70_XO_TUNE=y
