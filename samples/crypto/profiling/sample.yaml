sample:
  description: Profiling of cryptographic operations
  name: crypto_profiling
common:
  tags:
    - crypto
    - epacket
    - kv_store
    - logging
    - mcumgr
    - rpc
    - states
    - tdf
  platform_allow:
    - qemu_cortex_m3
    - native_sim
    - nrf52840dk/nrf52840
    - nrf5340dk/nrf5340/cpuapp
    - nrf5340dk/nrf5340/cpuapp/ns
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf9151dk/nrf9151/ns
  integration_platforms:
    - qemu_cortex_m3
    - native_sim
    - nrf52840dk/nrf52840
    - nrf5340dk/nrf5340/cpuapp
    - nrf5340dk/nrf5340/cpuapp/ns
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf9151dk/nrf9151/ns
tests:
  sample.app.crypto_profiling:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "ASCON backend - .*"
        - "MAC/HASH Algorithms"
