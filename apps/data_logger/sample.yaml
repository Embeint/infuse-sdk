sample:
  description: Basic data logger
  name: Data Logger
common:
  tags:
    - app
    - auto
    - bluetooth
    - data_logger
    - dfu
    - epacket
    - gnss
    - imu
    - kv_store
    - logging
    - math
    - mcumgr
    - memfault
    - modem
    - modem_monitor
    - net
    - reboot
    - rpc
    - sensor
    - shared_device
    - states
    - task_runner
    - tdf
    - time
    - version
    - watchdog
    - zbus
  build_only: true
  required_snippets:
    - infuse
tests:
  sample.app.data_logger:
    platform_allow:
      - thingy53/nrf5340/cpuapp/ns
      - thingy53/nrf5340/cpuapp
      - tauro/nrf9151/ns
    integration_platforms:
      - thingy53/nrf5340/cpuapp/ns
      - thingy53/nrf5340/cpuapp
      - tauro/nrf9151/ns
  sample.app.data_logger.wifi:
    sysbuild: true
    filter: not CONFIG_BUILD_WITH_TFM
    extra_args:
      - data_logger_SHIELD=nrf7002eb
      - data_logger_EXTRA_DTC_OVERLAY_FILE=boards/shields/epacket_udp.overlay
    platform_allow:
      - thingy53/nrf5340/cpuapp/ns
      - thingy53/nrf5340/cpuapp
    integration_platforms:
      - thingy53/nrf5340/cpuapp/ns
      - thingy53/nrf5340/cpuapp
