# Minimal ROM MCUboot configuration for nRF54L Bluetooth controllers
#
# Replaces boot/zephyr/prj.conf and the MCUboot board fragments.

CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

CONFIG_FLASH=y

### Use picolibc to reduce flash usage
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_NANO=y
### Disable malloc arena because we don't need it
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

### Link Time Optimizations (from socs/nrf54l*_cpuapp.conf)
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

### nRF54L RRAM (from boards/nrf54l15dk_nrf54l*_cpuapp.conf)
CONFIG_SPI_NOR=n
CONFIG_BOOT_WATCHDOG_FEED=n
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

### No serial input or output
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

### Unused features
CONFIG_MULTITHREADING=n
CONFIG_GPIO=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_ARM_MPU=n
