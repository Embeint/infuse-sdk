# USB Gateway options
# Common serial gateway options are in `../common/gateway_serial/gateway.conf`

# Set at the application level so twister filters see the Infuse-IoT defaults
CONFIG_INFUSE_SDK=y

# USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_INFUSE_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
