sample:
  description: Bluetooth <-> UART bridge
  name: gateway UART
common:
  tags:
    - app
    - auto
    - data_logger
    - epacket
    - gnss
    - imu
    - kv_store
    - logging
    - math
    - mcumgr
    - modem_monitor
    - rpc
    - serial
    - states
    - task_runner
    - tdf
    - watchdog
    - zbus
  build_only: true
  # Requires Bluetooth, and a serial backhaul that isn't RTT or USB (`gateway_usb`)
  filter: CONFIG_BT and not dt_compat_enabled("segger,rtt-uart") and
    not dt_compat_enabled("zephyr,cdc-acm-uart")
  required_snippets:
    - infuse
  platform_exclude:
    - native_sim
  integration_platforms:
    - nrf52840dk/nrf52840
    - xg24_dk2601b/efr32mg24b310f1536im48
tests:
  sample.app.gateway_uart: {}
  sample.app.gateway_uart.sysbuild:
    sysbuild: true
    filter: not CONFIG_BUILD_WITH_TFM
