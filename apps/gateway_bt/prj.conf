# Bluetooth Gateway options
CONFIG_INFUSE_SDK=y
CONFIG_INFUSE_WATCHDOG=y

CONFIG_EPACKET_FORWARDING=y
CONFIG_EPACKET_BUFFERS_TX=8
CONFIG_EPACKET_BUFFERS_RX=16

# Bluetooth
# Connection budget:
#   2 backhaul clients (peripheral role)
#   2 forwarding connections (central role)
#   2 connectable advertising sets (legacy name + ePacket)
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=6
CONFIG_EPACKET_FORWARDING_MAX_CONNECTIONS=2
CONFIG_BT_DEVICE_NAME="BT Gateway"

# Tasks
CONFIG_TASK_RUNNER=y
CONFIG_TASK_RUNNER_AUTO_ITERATE=y
CONFIG_TASK_RUNNER_TASK_TDF_LOGGER=y

# Gateway RPCs
CONFIG_INFUSE_RPC_CLIENT=y
