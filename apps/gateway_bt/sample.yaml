sample:
  description: Bluetooth <-> Bluetooth bridge
  name: gateway Bluetooth
common:
  tags:
    - app
    - auto
    - bluetooth
    - data_logger
    - epacket
    - kv_store
    - logging
    - math
    - rpc
    - states
    - task_runner
    - tdf
    - watchdog
  build_only: true
  required_snippets:
    - infuse
  platform_allow:
    - nrf52840dk/nrf52840
    - nrf5340dk/nrf5340/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
    - bonasus/nrf54l15/cpuapp
  integration_platforms:
    - nrf52840dk/nrf52840
    - nrf5340dk/nrf5340/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
    - bonasus/nrf54l15/cpuapp
tests:
  sample.app.gateway_bt: {}
  sample.app.gateway_bt.sysbuild:
    sysbuild: true
    filter: not CONFIG_BUILD_WITH_TFM
