type: map
mapping:
  key:
    type: str
    required: true
  url:
    type: str
    required: true
    length:
      min: 1
      max: 63
    pattern: '^[A-Za-z0-9.-]+$'
  port:
    type: int
    required: true
    range:
      min: 1
      max: 65535
