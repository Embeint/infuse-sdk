#
# Maps infuse-sdk source paths to test tags, for scripts/ci/test_plan.py.
#
# A changed file selects every test whose tags include any tag whose 'files'
# match it (entries ending in '/' match directories by prefix). Tests list the
# tag of their own area plus the tags of every area they depend on.
#
# A changed file that matches nothing here, is not inside a test/sample
# directory, and is not in twister_ignore.txt triggers a full twister run.

