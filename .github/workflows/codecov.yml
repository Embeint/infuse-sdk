name: Code Coverage with codecov

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/setup-twister/**'
      - '.github/workflows/codecov.yml'
      - 'include/**'
      - 'lib/**'
      - 'subsys/**'
      - 'tests/**'
      - '**/Kconfig*'
      - 'west.yml'
  schedule:
    # Run at 14:37 UTC every day
    - cron: '37 14 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  twister:
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: '--entrypoint /bin/bash'
      volumes:
        - /repo-cache/embeint:/github/cache/embeint
        - /repo-cache/ccache:/github/ccache
        - /repo-cache/pip-cache:/github/pip-cache
    strategy:
      fail-fast: false
      matrix:
        platform: ["mps2/an385", "native_sim", "unit_testing"]
        include:
          - platform: 'mps2/an385'
            normalized: 'mps2_an385'
          - platform: 'native_sim'
            normalized: 'native_sim'
          - platform: 'unit_testing'
            normalized: 'unit_testing'

    env:
      PIP_CACHE_DIR: /github/pip-cache
      CCACHE_DIR: /github/ccache
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      BASE_REF: ${{ github.base_ref }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Workspace cleanup
        run: |
          rm -rf ./{*,.*}
          rm -rf infuse-sdk twister-out*

      - name: Clone cached Embeint SDK repository
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
          cd infuse-sdk
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: infuse-sdk
          fetch-depth: 0

      - name: Set up Twister environment
        uses: ./infuse-sdk/.github/actions/setup-twister
        with:
          check-environment: 'true'

      - name: Run Tests with Coverage Information
        run: |
          mkdir -p coverage/reports
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister -i --force-color -N -v --filter runnable -p ${{ matrix.platform }} --coverage \
            -T infuse-sdk/tests --coverage-tool gcovr \
            --exclude-tag nano --exclude-tag external_service \
            --coverage-basedir infuse-sdk \
            -x=CONFIG_TEST_EXTRA_STACK_SIZE=4096 \
            -x=CONFIG_COVERAGE_ALL=n

      - name: Print ccache stats
        if: always()
        run: |
          ccache -s -vv

      - name: Rename coverage files
        if: always()
        run: |
          mv twister-out/coverage.json coverage/reports/${{ matrix.normalized }}.json
          python3 zephyr/scripts/ci/coverage/strip_function_pos.py coverage/reports/${{ matrix.normalized }}.json

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coverage Data (Subset ${{ matrix.normalized }})
          path: coverage/reports/${{ matrix.normalized }}.json
          retention-days: 1

  external-services:
    name: External Service Tests
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: '--entrypoint /bin/bash'
      volumes:
        - /repo-cache/embeint:/github/cache/embeint
        - /repo-cache/ccache:/github/ccache
        - /repo-cache/pip-cache:/github/pip-cache
    env:
      PIP_CACHE_DIR: /github/pip-cache
      CCACHE_DIR: /github/ccache
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      BASE_REF: ${{ github.base_ref }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Workspace cleanup
        run: |
          rm -rf ./{*,.*}
          rm -rf infuse-sdk twister-out*

      - name: Clone cached Embeint SDK repository
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
          cd infuse-sdk
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: infuse-sdk
          fetch-depth: 0

      - name: Set up Twister environment
        uses: ./infuse-sdk/.github/actions/setup-twister

      - name: Run External Service Tests with Coverage Information
        run: |
          mkdir -p coverage/reports
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister -i --force-color -N -v --filter runnable -p native_sim --coverage --retry-failed 3 \
            -T infuse-sdk/tests --coverage-tool gcovr \
            --tag external_service --coverage-basedir infuse-sdk \
            -x=CONFIG_TEST_EXTRA_STACK_SIZE=4096 \
            -x=CONFIG_COVERAGE_ALL=n

      - name: Print ccache stats
        if: always()
        run: |
          ccache -s -vv

      - name: Rename coverage files
        if: always()
        run: |
          mv twister-out/coverage.json coverage/reports/native_sim_external_services.json
          python3 zephyr/scripts/ci/coverage/strip_function_pos.py coverage/reports/native_sim_external_services.json

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coverage Data (External Services)
          path: coverage/reports/native_sim_external_services.json
          retention-days: 1

  babblesim:
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: '--entrypoint /bin/bash'
      volumes:
        - /repo-cache/embeint:/github/cache/embeint
        - /repo-cache/ccache:/github/ccache
        - /repo-cache/pip-cache:/github/pip-cache
    env:
      PIP_CACHE_DIR: /github/pip-cache
      CCACHE_DIR: /github/ccache
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      BASE_REF: ${{ github.base_ref }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /github/cache/embeint/tools/bsim
      BSIM_COMPONENTS_PATH: /github/cache/embeint/tools/bsim/components/

    steps:
      - name: Workspace cleanup
        run: |
          rm -rf ./{*,.*}
          rm -rf infuse-sdk

      - name: Clone cached Embeint SDK repository
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
          cd infuse-sdk
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: infuse-sdk
          fetch-depth: 0

      - name: Set up Twister environment
        uses: ./infuse-sdk/.github/actions/setup-twister
        with:
          group-filter: '+babblesim'
          check-environment: 'true'

      - name: BabbleSim build
        run: |
          cd ${BSIM_OUT_PATH}
          make everything -j 8

      - name: Run tests with BabbleSim
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          export INFUSE_BASE=${PWD}/infuse-sdk
          export WORK_DIR=${PWD}/bsim_out
          rm -rf $WORK_DIR
          $INFUSE_BASE/tests/bsim/ci.bt.sh
          $INFUSE_BASE/tests/bsim/ci.802154.sh
          $INFUSE_BASE/tests/bsim/ci.serial.sh

      - name: Print ccache stats
        if: always()
        run: |
          ccache -s -vv

      - name: Generate coverage report
        run: |
          export INFUSE_BASE=${PWD}/infuse-sdk
          export WORK_DIR=${PWD}/bsim_out

          mkdir -p coverage/reports
          gcovr -r $INFUSE_BASE \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --gcov-executable gcov -e tests/* -e .*generated.* -e .*/tests/.* -e .*/samples/.* \
            --exclude-branches-by-pattern "(^\s*LOG_(?:HEXDUMP_)?(?:DBG|INF|WRN|ERR)\(.*)|(^\s*__ASSERT(?:_EVAL|_NO_MSG|_POST_ACTION)?\(.*)" \
            --merge-mode-functions=separate --json \
            -o coverage/reports/nrf52_bsim.json \
            $WORK_DIR
          python3 zephyr/scripts/ci/coverage/strip_function_pos.py coverage/reports/nrf52_bsim.json

      - name: Upload Coverage Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coverage Data (BabbleSim)
          path: coverage/reports/nrf52_bsim.json
          if-no-files-found: ignore
          retention-days: 1

  codecov-results:
    name: "Publish Coverage Results"
    needs:
      - twister
      - external-services
      - babblesim
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # the codecov job might be skipped, we don't need to run this job then
    if: success() || failure()

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install Python packages
        run: |
          pip install -r scripts/requirements-actions.txt --require-hashes

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage/reports

      - name: Move coverage files
        run: |
          mv ./coverage/reports/*/*.json ./coverage/reports
          rm -f ./coverage/reports/merged.json
          ls -la ./coverage/reports

      - name: Generate list of coverage files
        id: get-coverage-files
        shell: cmake -P {0}
        run: |
          file(GLOB INPUT_FILES_LIST  "coverage/reports/*.json")
          set(MERGELIST "")
          set(FILELIST "")
          foreach(ITEM ${INPUT_FILES_LIST})
            get_filename_component(f ${ITEM} NAME)
            if(FILELIST STREQUAL "")
              set(FILELIST "${f}")
            else()
              set(FILELIST "${FILELIST},${f}")
            endif()
          endforeach()
          foreach(ITEM ${INPUT_FILES_LIST})
            get_filename_component(f ${ITEM} NAME)
            if(MERGELIST STREQUAL "")
              set(MERGELIST "--add-tracefile ${f}")
            else()
              set(MERGELIST "${MERGELIST} -a ${f}")
            endif()
          endforeach()
          file(APPEND $ENV{GITHUB_OUTPUT} "mergefiles=${MERGELIST}\n")
          file(APPEND $ENV{GITHUB_OUTPUT} "covfiles=${FILELIST}\n")

      - name: Merge coverage files
        run: |
          cd ./coverage/reports
          gcovr ${{ steps.get-coverage-files.outputs.mergefiles }} --merge-mode-functions=separate --json merged.json
          gcovr ${{ steps.get-coverage-files.outputs.mergefiles }} --merge-mode-functions=separate --cobertura merged.xml
          ls -la .

      - name: Upload Merged Coverage Results and Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coverage Data and report
          path: |
            coverage/reports/merged.json
            coverage/reports/merged.xml
          retention-days: 2

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/reports/merged.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          verbose: true
