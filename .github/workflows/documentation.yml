name: Documentation Build & Deploy

on:
  push:
    branches:
    - main
    - v*
  pull_request:
    paths:
    - '.github/workflows/documentation.yml'
    - 'doc/**'
    - 'doc/requirements.txt'
    - '**.rst'
    - 'include/**'
    - 'tests/**'
    - '**/Kconfig*'
    - 'west.yml'

env:
  AWS_REGION: ap-southeast-2

jobs:
  doc-build-html:
    name: "Documentation Build (HTML)"
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: '--entrypoint /bin/bash'
      volumes:
      - /repo-cache/embeint:/github/cache/embeint
      - /repo-cache/pip-cache:/github/pip-cache
      env:
        PIP_CACHE_DIR: /github/pip-cache
        # NOTE: west docstrings will be extracted from the version listed here
        WEST_VERSION: 1.2.0
        # The latest CMake available directly with apt is 3.18, but we need >=3.20
        # so we fetch that through pip.
        CMAKE_VERSION: 3.20.5
        DOXYGEN_VERSION: 1.17.0
        DOXYGEN_SHA256SUM: 75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
        BASE_REF: ${{ github.base_ref }}
        ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    timeout-minutes: 10
    concurrency:
      group: doc-build-html-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Workspace cleanup
      run: |
        rm -rf ./{*,.*}
        rm -rf infuse-sdk twister-out*

    - name: Clone cached Infuse SDK repository
      continue-on-error: true
      run: |
        git config --global --add safe.directory /github/cache/embeint/infuse-sdk/.git
        git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
        cd infuse-sdk
        git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
        path: infuse-sdk
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12

    - name: Install Python packages
      working-directory: infuse-sdk
      run: |
        pip install --cache-dir $PIP_CACHE_DIR -r scripts/requirements-actions.txt --require-hashes

    - name: Environment Setup
      working-directory: infuse-sdk
      run: |
        git config --global http.version HTTP/1.1
        if [ "${{github.event_name}}" = "pull_request" ]; then
          git config --global user.email "ci@embeint.com"
          git config --global user.name "Embeint CI"
          rm -fr ".git/rebase-apply"
          rm -fr ".git/rebase-merge"
          git rebase origin/${BASE_REF}
          git clean -f -d
          git log -n 10 --pretty=oneline
        fi

        west init -l . || true
        west config --global update.narrow true
        west update --path-cache /github/cache/embeint
        west forall -c 'git reset --hard HEAD'

        echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$( cat SDK_VERSION )" >> $GITHUB_ENV

    - name: install-pkgs
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build graphviz lcov mscgen
        rm -rf doxygen-*
        wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        echo "${DOXYGEN_SHA256SUM}  doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" | sha256sum -c
        if [ $? -ne 0 ]; then
          echo "Failed to verify doxygen tarball"
          exit 1
        fi
        tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
        echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH

    - name: install-pip
      run: |
        pip install  --cache-dir $PIP_CACHE_DIR -r zephyr/doc/requirements.txt --require-hashes
        pip install  --cache-dir $PIP_CACHE_DIR -r infuse-sdk/doc/requirements.txt

    - name: build-docs
      working-directory: infuse-sdk
      shell: bash
      env:
        DOXYGEN_WARN_AS_ERROR: FAIL_ON_WARNINGS
      run: |
        if [[ "$GITHUB_REF" =~ "refs/tags/v" ]]; then
          DOC_TAG="release"
        else
          DOC_TAG="development"
        fi

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          DOC_TARGET="html-fast"
        else
          DOC_TARGET="html"
        fi

        DOC_TAG=${DOC_TAG} SPHINXOPTS="-q -t publish" make -C doc ${DOC_TARGET}

    - name: upload-build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: html-output
        path: infuse-sdk/doc/_build/html
        if-no-files-found: error
        include-hidden-files: true

  doc-publish:
    name: Publish Documentation
    runs-on: ubuntu-24.04
    needs: doc-build-html
    permissions:
      id-token: write

    steps:
    - name: Download html artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: html-output
        path: html-output

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_DEV_DOCS_ROLE_ARN }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ env.AWS_REGION }}

    - name: Upload to AWS S3
      if: ${{ github.event_name == 'push' }}
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        if [ "${HEAD_BRANCH:0:1}" == "v" ]; then
          VERSION=${HEAD_BRANCH:1}
        else
          VERSION="latest"
        fi

        echo "Uploading to s3://dev.infuse-iot.com/${VERSION}"
        aws s3 sync --quiet html-output s3://dev.infuse-iot.com/${VERSION} --delete

    - name: Invalidate CloudFront
      if: ${{ github.event_name == 'push' }}
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        if [ "${HEAD_BRANCH:0:1}" == "v" ]; then
          VERSION=${HEAD_BRANCH:1}
        else
          VERSION="latest"
        fi

        echo "Invalidating CloudFront cache for ${VERSION}"
        aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DEV_CLOUDFRONT_DIST_ID }} --paths "/${VERSION}/*"
