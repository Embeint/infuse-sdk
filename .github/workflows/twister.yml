name: Run tests with twister

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '!doc/**'
      - '!scripts/**'
      - '!.github/**'
      - '.github/actions/setup-twister/**'
      - '.github/workflows/twister.yml'
  schedule:
    # Run at 14:17 UTC every day
    - cron: '17 14 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  twister-run:
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.1.20260327
      options: '--entrypoint /bin/bash'
      volumes:
        - /repo-cache/embeint:/github/cache/embeint
        - /repo-cache/ccache:/github/ccache
        - /repo-cache/pip-cache:/github/pip-cache
    strategy:
      fail-fast: false
      matrix:
        subset: [1, 2, 3, 4]
    env:
      PIP_CACHE_DIR: /github/pip-cache
      CCACHE_DIR: /github/ccache
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      TWISTER_COMMON: ' --force-color --inline-logs -v -N -M --retry-failed 3 --exclude-tag external_service'
      DAILY_OPTIONS: ' -M --build-only --show-footprint'
      VENDOR_FILTER: ' --vendor nordic --vendor zephyr --vendor embeint '
      EXTRA_BOARDS: ' --platform qemu_cortex_m3 --platform qemu_cortex_m0 '
      UNIT_TESTING: ' --platform unit_testing '
      PR_OPTIONS: ' --clobber-output --integration'
      COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Workspace cleanup
        run: |
          rm -rf ./{*,.*}
          rm -rf infuse-sdk twister-out*

      - name: Clone cached Embeint SDK repository
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
          cd infuse-sdk
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: infuse-sdk
          fetch-depth: 0

      - name: Set up Twister environment
        uses: ./infuse-sdk/.github/actions/setup-twister
        with:
          install-actions-requirements: ${{ github.event_name == 'pull_request' }}
          fetch-blobs: 'true'
          check-environment: 'true'

      - name: Build standalone algorithm
        if: matrix.subset == 1
        run: |
          cmake -S infuse-sdk/samples/algorithms/packager/samples/upside_down -B algorithm-build
          cmake --build algorithm-build
          rm -r algorithm-build

      - name: Build nRF Edge AI algorithm
        if: matrix.subset == 1
        run: |
          cmake -S infuse-sdk/samples/algorithms/packager/samples/nrf_edge_ai/imu_gestures/ -B algorithm-build
          cmake --build algorithm-build
          rm -r algorithm-build

      - if: github.event_name == 'pull_request' && matrix.subset == 1
        name: Run Unit Tests with Twister (Pull Request)
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister ${TWISTER_COMMON} ${UNIT_TESTING} -T infuse-sdk

      - if: github.event_name == 'pull_request'
        name: Run Tests with Twister (Pull Request)
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister --subset ${{matrix.subset}}/${{ strategy.job-total }} ${TWISTER_COMMON} ${PR_OPTIONS} -T infuse-sdk -T modules/nrfconnect/sdk-nrf

      - if: github.event_name == 'schedule'
        name: Run Unit Tests with Twister (Daily)
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister --subset ${{matrix.subset}}/${{ strategy.job-total }} ${TWISTER_COMMON} ${UNIT_TESTING} -T infuse-sdk

      - if: github.event_name == 'schedule'
        name: Run Board Tests with Twister (Daily)
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister --subset ${{matrix.subset}}/${{ strategy.job-total }} ${TWISTER_COMMON} ${EXTRA_BOARDS} ${DAILY_OPTIONS} -T infuse-sdk

      - if: github.event_name == 'schedule'
        name: Run Vendor Tests with Twister (Daily)
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          echo 'twister ${TWISTER_COMMON} ${VENDOR_FILTER} ${DAILY_OPTIONS} --all -T infuse-sdk/apps -T infuse-sdk/samples'
          $ZEPHYR_BASE/scripts/twister --subset ${{matrix.subset}}/${{ strategy.job-total }} ${TWISTER_COMMON} ${VENDOR_FILTER} ${DAILY_OPTIONS} --all -T infuse-sdk/apps -T infuse-sdk/samples
          echo 'twister ${TWISTER_COMMON} ${DAILY_OPTIONS} --integration -T infuse-sdk/tests -T modules/nrfconnect/sdk-nrf'
          $ZEPHYR_BASE/scripts/twister --subset ${{matrix.subset}}/${{ strategy.job-total }} ${TWISTER_COMMON} ${DAILY_OPTIONS} --integration -T infuse-sdk/tests -T modules/nrfconnect/sdk-nrf

      - name: Print ccache stats
        if: always()
        run: |
          ccache -s -vv

  external-services:
    name: External Service Tests
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.1.20260327
      options: '--entrypoint /bin/bash'
      volumes:
        - /repo-cache/embeint:/github/cache/embeint
        - /repo-cache/ccache:/github/ccache
        - /repo-cache/pip-cache:/github/pip-cache
    env:
      PIP_CACHE_DIR: /github/pip-cache
      CCACHE_DIR: /github/ccache
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      BASE_REF: ${{ github.base_ref }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Workspace cleanup
        run: |
          rm -rf ./{*,.*}
          rm -rf infuse-sdk twister-out*

      - name: Clone cached Embeint SDK repository
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git clone --shared /github/cache/embeint/infuse-sdk infuse-sdk
          cd infuse-sdk
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: infuse-sdk
          fetch-depth: 0

      - name: Set up Twister environment
        uses: ./infuse-sdk/.github/actions/setup-twister
        with:
          install-actions-requirements: ${{ github.event_name == 'pull_request' }}

      - name: DNS Checks
        continue-on-error: true
        run: |
          cat /etc/resolv.conf
          getent ahostsv4 google.com.
          getent ahostsv6 google.com.

      - name: Run External Service Tests with Twister
        run: |
          export ZEPHYR_BASE=${PWD}/zephyr
          $ZEPHYR_BASE/scripts/twister --force-color --inline-logs -v -N -M --retry-failed 3 --tag external_service --integration -T infuse-sdk/tests

      - name: Print ccache stats
        if: always()
        run: |
          ccache -s -vv
