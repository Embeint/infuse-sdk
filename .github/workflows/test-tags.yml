name: Test Tags

# Pull request twister runs only select tests whose tags match the changed
# files (scripts/ci/test_plan.py). Ensure every test is tagged with all the
# areas it depends on, so no affected test is skipped.
#
# The whole tree is checked, since source changes (e.g. a new include in a
# module) can make the tags of unmodified tests incomplete.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-test-tags:
    runs-on: ubuntu-24.04
    name: Check test tags cover their dependencies
    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install Python packages
        run: |
          pip install -r scripts/requirements-actions.txt --require-hashes

      - name: Check test tags
        run: |
          if ! ./scripts/ci/check_test_tags.py > output.txt; then
            cat output.txt
            while IFS=: read -r file msg; do
              echo "::error file=${file},title=Test tags::${msg# }"
            done < <(grep ': missing tags\|: no tags' output.txt)
            echo "::error ::Run scripts/ci/check_test_tags.py --fix to add the missing tags"
            exit 1
          fi
          echo "All test tags cover their dependencies"
