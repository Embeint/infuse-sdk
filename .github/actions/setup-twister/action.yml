name: Set up Twister environment
description: Prepare the workspace dependencies and compiler cache for Twister jobs

inputs:
  install-actions-requirements:
    description: Install the Python packages used by GitHub Actions
    default: 'true'
  fetch-blobs:
    description: Fetch binary blobs required by hardware platform builds
    default: 'false'
  check-environment:
    description: Print tool and GitHub environment diagnostics
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.install-actions-requirements == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.12

    - name: Install Python packages
      if: inputs.install-actions-requirements == 'true'
      shell: bash
      working-directory: infuse-sdk
      run: |
        pip install --cache-dir $PIP_CACHE_DIR -r scripts/requirements-actions.txt --require-hashes

    - name: Initialize west workspace
      shell: bash
      working-directory: infuse-sdk
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git config --global user.email "ci@embeint.com"
          git config --global user.name "Embeint CI"
          rm -fr ".git/rebase-apply"
          git rebase origin/${BASE_REF}
          git log -n 10 --pretty=oneline
        fi

        west init -l . || true
        west config --global update.narrow true
        if [ -e ../zephyr/.git ]; then
          git -C ../zephyr reset --hard HEAD
        fi
        west update --path-cache /github/cache/embeint 2>&1 1> west.update.log || west update --path-cache /github/cache/embeint 2>&1 1> west.update.log || ( rm -rf ../modules ../bootloader ../tools && west update --path-cache /github/cache/embeint)
        west forall -c 'git reset --hard HEAD'

        echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$( cat SDK_VERSION )" >> $GITHUB_ENV

    - name: Fetch binary blobs
      if: inputs.fetch-blobs == 'true'
      shell: bash
      working-directory: infuse-sdk
      run: west blobs fetch hal_nordic nrf_wifi hal_espressif

    - name: Install Zephyr Python packages
      shell: bash
      working-directory: zephyr
      run: pip install --cache-dir $PIP_CACHE_DIR -r scripts/requirements.txt

    - name: Check environment
      if: inputs.check-environment == 'true'
      shell: bash
      run: |
        cmake --version
        gcc --version
        ls -la /opt/toolchains
        ls -la
        echo "github.ref: ${{ github.ref }}"
        echo "github.base_ref: ${{ github.base_ref }}"
        echo "github.ref_name: ${{ github.ref_name }}"

    - name: Set up ccache
      shell: bash
      run: |
        mkdir -p ${CCACHE_DIR}
        ccache -M 20G
        ccache -p
        ccache -z -s -vv
